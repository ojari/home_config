# Open matched file:// links for source files in the running Emacs instance
# instead of the OS default handler. Only fires for real clickable links
# (e.g. `ls --hyperlink=auto` output, or OSC 8 links a program emits) —
# see open_url_with in kitty.conf for the click behaviour this hooks into.
#
# -n:    don't wait for the buffer to be closed
# -a "": if no Emacs server is running yet, start one (falls back to a
#        plain default-config daemon; the normal case is that sway's
#        startup.sh already has an Emacs instance with server-start running)
protocol file
ext py,c,h,cc,cpp,cxx,hpp,hxx
action launch --type=background -- emacsclient -n $FILE_PATH
