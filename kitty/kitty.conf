include themes/Zenburn.conf

font_family      FiraCode Nerd Font
font_size        12.0

allow_remote_control  yes

# Remove old bindings (optional — skip if you just want additional keys)
map ctrl+shift+[ no_op
map ctrl+shift+] no_op

# New bindings — vim-style directional focus
map alt+j neighboring_window left
map alt+l neighboring_window right
map alt+i neighboring_window up
map alt+k neighboring_window down

# Open a file path under the cursor (real file:// hyperlinks, e.g. from
# `ls --hyperlink=auto`) with the program picked by open-actions.conf.
open_url_with default

# Pick any path-looking text on screen (works even without a real
# hyperlink — e.g. compiler output, `find`/`grep` results) and open it
# in the running Emacs instance.
map ctrl+shift+o kitten hints --type path --program "launch --type=background emacsclient -n "
